name: Build iOS App (prebuilt LLVM)

# Same build as build.yml, but downloads the LLVM support libs published by me

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Package
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version
        run: |
          VERSION=$(awk -F'=' '/^[[:space:]]*VERSION[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); print $2; exit}' Config.xcconfig)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          set -e

          # Packages we desperately need
          brew install ldid dpkg libarchive

      - name: Setup
        run: |
          set -e

      - name: Download prebuilt LLVM support libs
        run: |
          curl -fL -o libs.tar.xz "https://github.com/Jordan2fast/Nyxian-Unlocked/releases/download/llvm-libs/CoreCompilerSupportLibs.tar.xz"
          mkdir -p Frameworks/CoreCompiler
          tar -xJf libs.tar.xz -C Frameworks/CoreCompiler

      - name: Build Nyxian
        timeout-minutes: 1200
        run: |
          set -e

          CHECK_DEPS=0 make all

      - name: Upload Nyxian
        uses: actions/upload-artifact@v7
        with:
          path: Nyxian.ipa
          archive: false
